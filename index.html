<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Mathventure — Level Up Your Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* ===== Design tokens — Duolingo-inspired: bright, chunky, rounded ===== */
  --ink:#3C3C3C;
  --ink-soft:#6B7280;
  --bg:#F7F7F7;
  --paper:#FFFFFF;
  --line:#E5E5E5;

  --green:#58CC02;      --green-deep:#46A302;   /* primary CTA / correct */
  --blue:#1CB0F6;       --blue-deep:#1899D6;    /* secondary / info */
  --red:#FF4B4B;        --red-deep:#EA2B2B;     /* incorrect / hearts */
  --gold:#FFC800;       --gold-deep:#E5A800;    /* XP / gems */
  --purple:#CE82FF;     --purple-deep:#A560E0;

  /* strand colors (kept distinct per world) */
  --teal:#1CC0A6;       --teal-deep:#0FA089;
  --pk-purple:#8A6DFF;  --pk-purple-deep:#6B4EEA;
  --coral:#FF7757;      --coral-deep:#F0562F;
  --dune-gold:#FFC02E;  --dune-gold-deep:#E5A100;
  --lagoon:#22B8DE;     --lagoon-deep:#1497BE;

  --ok:#58CC02;
  --warn:#FF4B4B;
  --radius-lg:24px; --radius-md:16px; --radius-sm:12px;
  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--bg);
  min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3,h4,.display{font-family:var(--font-display); margin:0; color:var(--ink); font-weight:700;}
p{margin:0;}
button{font-family:var(--font-body); cursor:pointer;}
::selection{background:var(--gold); color:var(--ink);}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }

#app{max-width:1000px; margin:0 auto; padding:20px 20px 100px; min-height:100vh; position:relative;}

/* ---------- Buttons: Duolingo-style chunky 3D press ---------- */
.btn{
  font-family:var(--font-display); font-weight:700; font-size:1rem;
  border:none; border-radius:16px; padding:14px 26px;
  background:var(--paper); color:var(--ink);
  border-bottom:4px solid var(--line);
  transition:transform .08s ease, border-bottom-width .08s ease, margin-top .08s ease;
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
  text-transform:uppercase; letter-spacing:.02em;
}
.btn:active:not(:disabled){transform:translateY(2px); border-bottom-width:2px;}
.btn-primary{background:var(--green); color:#fff; border-bottom-color:var(--green-deep);}
.btn-gold{background:var(--gold); color:var(--ink); border-bottom-color:var(--gold-deep);}
.btn-coral{background:var(--coral); color:#fff; border-bottom-color:var(--coral-deep);}
.btn-purple{background:var(--purple); color:#fff; border-bottom-color:var(--purple-deep);}
.btn-blue{background:var(--blue); color:#fff; border-bottom-color:var(--blue-deep);}
.btn-outline{background:var(--paper); color:var(--ink-soft); border:2px solid var(--line); border-bottom:4px solid var(--line);}
.btn-block{width:100%;}
.btn-lg{padding:16px 32px; font-size:1.1rem; border-radius:18px;}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}
.btn-sm{padding:8px 14px; font-size:.78rem; border-radius:12px; border-bottom-width:3px;}

/* ---------- Cards / panels ---------- */
.panel{
  background:var(--paper); border-radius:var(--radius-lg);
  border:2px solid var(--line);
  padding:28px;
}
.card{
  background:var(--paper); border-radius:var(--radius-md);
  border:2px solid var(--line); border-bottom-width:4px;
  padding:18px;
}

/* ---------- Top bar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; margin-bottom:22px; flex-wrap:wrap;
}
.identity{display:flex; align-items:center; gap:12px;}
.identity-text{line-height:1.15;}
.identity-name{font-family:var(--font-display); font-weight:800; font-size:1.05rem;}
.identity-sub{font-size:.8rem; color:var(--ink-soft); font-weight:700;}
.stat-pills{display:flex; gap:8px; flex-wrap:wrap;}
.pill{
  display:flex; align-items:center; gap:6px;
  background:var(--paper); border:2px solid var(--line); border-radius:999px; padding:7px 13px;
  font-weight:800; font-size:.92rem; font-family:var(--font-display);
}
.pill.pill-xp{color:var(--gold-deep); border-color:#FFE79A;}
.pill.pill-gems{color:var(--blue-deep); border-color:#B6E7FF;}
.pill.pill-streak{color:#E0670C; border-color:#FFD8B3;}
.pill.pill-hearts{color:var(--red-deep); border-color:#FFC9C9;}
.pill .icon{font-size:1.05rem;}

/* ---------- Avatar ---------- */
.avatar{
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  position:relative; flex-shrink:0; border:3px solid #fff; box-shadow:0 0 0 2px var(--line);
}
.avatar .emoji{filter:drop-shadow(0 2px 0 rgba(0,0,0,0.08));}
.avatar-accessory{position:absolute; top:-22%; left:50%; transform:translateX(-50%); line-height:1; filter:drop-shadow(0 2px 1px rgba(0,0,0,0.15)); pointer-events:none;}

/* ---------- Screen fade ---------- */
.screen{animation:fadeUp .3s ease both;}
@keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
@keyframes popIn{ 0%{transform:scale(.6); opacity:0;} 70%{transform:scale(1.08);} 100%{transform:scale(1); opacity:1;} }
@keyframes shake{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(3px);} 30%,50%,70%{transform:translateX(-5px);} 40%,60%{transform:translateX(5px);} }

/* ---------- Landing ---------- */
.hero{ text-align:center; padding:30px 16px 8px; }
.hero h1{font-size:clamp(2.2rem, 6vw, 3.6rem); line-height:1.05; letter-spacing:-0.01em; color:var(--green-deep);}
.hero .sub{font-size:1.1rem; color:var(--ink-soft); font-weight:700; max-width:560px; margin:14px auto 0;}
.hero-emoji-row{font-size:2.4rem; margin:20px 0 8px; display:flex; justify-content:center; gap:14px;}
.hero-emoji-row span{display:inline-block; animation:bob 3.2s ease-in-out infinite;}
.hero-emoji-row span:nth-child(2){animation-delay:.4s;}
.hero-emoji-row span:nth-child(3){animation-delay:.8s;}
.hero-emoji-row span:nth-child(4){animation-delay:1.2s;}
.hero-emoji-row span:nth-child(5){animation-delay:1.6s;}
@keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }

.profile-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px; margin-top:22px; }
.profile-tile{
  background:var(--paper); border-radius:var(--radius-md); padding:16px 10px;
  text-align:center; border:2px solid var(--line); border-bottom-width:4px;
  display:flex; flex-direction:column; align-items:center; gap:8px;
}
.profile-tile:hover{border-color:var(--green);}
.profile-tile .name{font-family:var(--font-display); font-weight:800;}
.profile-tile .lvl{font-size:.76rem; color:var(--ink-soft); font-weight:700;}

.field-label{font-weight:800; font-size:.85rem; color:var(--ink-soft); margin-bottom:6px; display:block;}
input[type=text]{
  font-family:var(--font-body); font-size:1.05rem; font-weight:700; padding:14px 16px;
  border-radius:14px; border:2px solid var(--line); width:100%; background:var(--paper); color:var(--ink);
}
input[type=text]:focus{border-color:var(--blue);}

/* ---------- Avatar creator ---------- */
.creator-grid{display:grid; grid-template-columns:280px 1fr; gap:28px;}
@media (max-width:720px){ .creator-grid{grid-template-columns:1fr;} }
.avatar-preview-wrap{display:flex; flex-direction:column; align-items:center; gap:14px;}
.option-group{margin-bottom:20px;}
.option-title{font-family:var(--font-display); font-weight:800; margin-bottom:10px; font-size:.95rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
.option-row{display:flex; gap:10px; flex-wrap:wrap;}
.option-chip{
  border:2px solid var(--line); background:var(--paper); border-radius:14px;
  padding:10px; font-size:1.5rem; line-height:1; width:56px; height:56px;
  display:flex; align-items:center; justify-content:center; transition:transform .1s ease; border-bottom-width:4px;
}
.option-chip.selected{border-color:var(--green); background:#EBFAE0; transform:scale(1.08);}
.color-chip{width:44px; height:44px; border-radius:50%; border:3px solid transparent; cursor:pointer;}
.color-chip.selected{border-color:var(--ink); transform:scale(1.12); box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--green);}

/* ---------- World map: Duolingo skill-circle nodes ---------- */
.map-wrap{ padding:8px 0 20px; }
.node-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:16px; }
.skill-card{
  background:var(--paper); border-radius:var(--radius-lg); border:2px solid var(--line); border-bottom-width:5px;
  padding:20px; text-align:left; display:flex; align-items:center; gap:16px; transition:transform .08s ease, border-bottom-width .08s ease;
}
.skill-card:active{transform:translateY(3px); border-bottom-width:2px;}
.skill-node{
  width:76px; height:76px; border-radius:50%; flex-shrink:0; position:relative;
  display:flex; align-items:center; justify-content:center;
}
.skill-node .ring{position:absolute; inset:0; border-radius:50%;}
.skill-node .hole{position:absolute; inset:8px; border-radius:50%; background:var(--paper); display:flex; align-items:center; justify-content:center; font-size:1.7rem;}
.skill-info{flex:1; min-width:0;}
.skill-name{font-family:var(--font-display); font-weight:800; font-size:1.1rem;}
.skill-tagline{color:var(--ink-soft); font-weight:700; font-size:.8rem; margin-top:2px;}
.skill-grade-pill{display:inline-block; margin-top:8px; font-family:var(--font-display); font-weight:800; font-size:.78rem; padding:4px 10px; border-radius:999px;}
.skill-crown{position:absolute; top:-10px; right:-4px; font-size:1.3rem; filter:drop-shadow(0 2px 0 rgba(0,0,0,.15));}

/* ---------- Quest / lesson screen ---------- */
.quest-header{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
.quit-x{font-size:1.4rem; color:var(--ink-soft); background:none; border:none; padding:4px; line-height:1;}
.lesson-progress-track{ flex:1; height:16px; border-radius:999px; background:var(--line); overflow:hidden; }
.lesson-progress-fill{ height:100%; border-radius:999px; background:var(--green); transition:width .35s ease; }
.progress-caption-sm{ font-size:.72rem; font-weight:800; color:var(--ink-soft); margin-top:4px; text-align:center; }
.progress-track{ height:10px; border-radius:999px; background:var(--line); overflow:hidden; }
.progress-fill{ height:100%; border-radius:999px; transition:width .4s ease; }
.hearts-row{display:flex; gap:3px; font-size:1.15rem;}
.heart-lost{opacity:.25; filter:grayscale(1);}

.strand-tag{
  display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:999px;
  font-family:var(--font-display); font-weight:800; color:#fff; font-size:.82rem; margin-bottom:14px;
}

.question-card{ padding:8px 4px 130px; }
.question-prompt{font-family:var(--font-display); font-size:1.5rem; font-weight:800; line-height:1.35; margin-bottom:26px; text-align:center;}
.choice-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:640px; margin:0 auto;}
@media (max-width:560px){ .choice-grid{grid-template-columns:1fr;} }
.choice-btn{
  text-align:left; background:var(--paper); border:2px solid var(--line); border-bottom:4px solid var(--line); border-radius:16px;
  padding:16px 18px; font-family:var(--font-body); font-weight:800; font-size:1.05rem; color:var(--ink);
  transition:transform .08s ease, border-color .12s ease, background .12s ease;
}
.choice-btn:hover:not(:disabled){border-color:#C8C8C8;}
.choice-btn:disabled{cursor:default;}
.choice-btn.selected{border-color:var(--blue); background:#DDF4FF;}
.choice-btn.correct{background:#D7FFB8; border-color:var(--green); color:var(--green-deep);}
.choice-btn.incorrect{background:#FFDBDB; border-color:var(--red); color:var(--red-deep); animation:shake .4s ease;}
.choice-btn.faded{opacity:.5;}

/* ---------- Sticky bottom action bar (Duolingo signature) ---------- */
.bottom-bar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--paper); border-top:2px solid var(--line);
  padding:16px 20px calc(16px + env(safe-area-inset-bottom));
}
.bottom-bar-inner{max-width:1000px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px;}
.bottom-bar.state-good{background:#D7FFB8; border-top-color:#B7EE85;}
.bottom-bar.state-bad{background:#FFDBDB; border-top-color:#FFB3B3;}
.bottom-feedback{display:flex; align-items:center; gap:12px; font-weight:800; flex:1; min-width:0;}
.bottom-feedback .headline{font-family:var(--font-display); font-size:1.1rem;}
.bottom-feedback .sub{font-size:.85rem; font-weight:700; color:var(--ink-soft); margin-top:2px;}
.state-good .bottom-feedback .headline{color:var(--green-deep);}
.state-bad .bottom-feedback .headline{color:var(--red-deep);}

/* ---------- Lesson complete ---------- */
.complete-hero{text-align:center; padding:30px 16px;}
.complete-hero .big-emoji{font-size:4rem; animation:popIn .5s ease both;}
.complete-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:520px; margin:26px auto 0;}
.complete-stat{background:var(--paper); border:2px solid var(--line); border-bottom-width:4px; border-radius:16px; padding:16px 8px; text-align:center;}
.complete-stat .val{font-family:var(--font-display); font-weight:800; font-size:1.5rem;}
.complete-stat .lab{font-size:.75rem; color:var(--ink-soft); font-weight:700; margin-top:2px;}

/* ---------- Toast ---------- */
.toast-row{position:fixed; top:18px; right:18px; z-index:50; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:var(--ink); color:#fff; padding:10px 18px; border-radius:14px; font-family:var(--font-display);
  font-weight:800; box-shadow:0 6px 20px rgba(0,0,0,0.2); animation:toastIn .3s ease both, toastOut .4s ease 1.8s both;
}
@keyframes toastIn{ from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);} }
@keyframes toastOut{ to{opacity:0; transform:translateX(30px);} }

/* ---------- Dashboard ---------- */
.dash-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:16px; margin-top:18px;}
.strand-row{display:flex; align-items:center; gap:14px; padding:14px; border-radius:16px; background:var(--paper); border:2px solid var(--line);}
.strand-icon{width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0;}
.badge-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:12px; margin-top:14px;}
.badge-tile{background:var(--paper); border:2px solid var(--line); border-bottom-width:4px; border-radius:16px; padding:14px 10px; text-align:center;}
.badge-tile.locked{opacity:.35;}
.badge-tile .b-icon{font-size:1.8rem;}
.badge-tile .b-name{font-size:.76rem; font-weight:800; margin-top:6px; line-height:1.2;}

/* ---------- Bottom tab bar (primary nav) ---------- */
.tab-bar{
  position:fixed; left:0; right:0; bottom:0; z-index:35;
  background:var(--paper); border-top:2px solid var(--line);
  display:flex; justify-content:space-around; gap:4px;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.tab-btn{
  background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px;
  color:var(--ink-soft); font-weight:800; font-size:.68rem; font-family:var(--font-body);
  padding:6px 4px; border-radius:12px; flex:1; max-width:120px; transition:background .12s ease, color .12s ease;
}
.tab-btn .tab-icon{font-size:1.35rem; line-height:1;}
.tab-btn.active{color:var(--green-deep); background:#EBFAE0;}

/* ---------- Skill card caption ---------- */
.skill-caption{font-size:.72rem; color:var(--ink-soft); font-weight:700; margin-top:4px;}

/* ---------- Info banner ---------- */
.info-banner{
  display:flex; align-items:flex-start; gap:10px; background:#EAF6FF; border:2px solid #CDEBFF;
  border-radius:16px; padding:14px 16px; margin:12px 0 4px; font-size:.88rem; font-weight:700; color:#0F5C82;
}
.info-banner .ii{font-size:1.2rem; flex-shrink:0;}
.grade-choice-row{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:18px 0;}
.grade-choice{border:2px solid var(--line); border-bottom-width:4px; border-radius:14px; background:var(--paper); padding:14px 8px; font-family:var(--font-display); font-weight:800; font-size:1.05rem; color:var(--ink);}
.grade-choice:hover,.grade-choice.selected{border-color:var(--green); background:#EBFAE0;}
.mistake-list{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
.mistake-item{background:#FFF6DA; border:2px solid #F4D98A; border-radius:14px; padding:12px 14px;}
.mistake-item .mistake-question{font-family:var(--font-display); font-weight:800;}
.mistake-item .mistake-detail{font-size:.8rem; color:var(--ink-soft); margin-top:4px;}
@media (max-width:560px){ .grade-choice-row{grid-template-columns:repeat(3,1fr);} }


.section-title{font-family:var(--font-display); font-weight:800; font-size:1.3rem; margin:26px 0 4px;}
.muted{color:var(--ink-soft); font-weight:600;}
.center{text-align:center;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.spacer-16{height:16px;}
.spacer-24{height:24px;}
.link-btn{background:none; border:none; color:var(--ink-soft); font-weight:800; text-decoration:underline; padding:4px;}
.footer-note{text-align:center; color:var(--ink-soft); font-size:.8rem; margin-top:36px; font-weight:600;}
</style>
</head>
<body>
<div id="app"><div class="screen center" style="padding-top:80px;"><p class="muted">Loading Mathventure…</p></div></div>
<script>
// ===== Utility =====
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = randInt(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function round2(n) { return Math.round(n * 100) / 100; }
function fmtMoney(n) { return '$' + n.toFixed(2); }
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function pn(n) { return n < 0 ? `(${n})` : String(n); } // parenthesize only negatives, for clean "a + b" vs "a + (-b)" display

// Build a 4-choice set from a correct value + a distractor generator fn() -> value
// numeric-safe: dedupes, formats with fmt()
function makeChoices(correct, distractorFn, fmt) {
  fmt = fmt || (x => String(x));
  const vals = new Set([correct]);
  let guard = 0;
  while (vals.size < 4 && guard < 200) {
    guard++;
    const d = distractorFn();
    if (d !== correct && !vals.has(d) && isFinite(d)) vals.add(d);
  }
  // if we ran out of unique distractors, pad with correct +/- small offsets
  let pad = 1;
  while (vals.size < 4) { const d = correct + pad; if (!vals.has(d)) vals.add(d); pad++; }
  const arr = shuffle(Array.from(vals));
  const choices = arr.map(fmt);
  const correctIndex = arr.indexOf(correct);
  return { choices, correctIndex };
}

function mcq(prompt, correctLabel, distractorLabels, explanation) {
  const seen = new Set([correctLabel]);
  const uniqueDistractors = [];
  for (const d of distractorLabels) {
    if (!seen.has(d)) { seen.add(d); uniqueDistractors.push(d); }
  }
  const choices = shuffle([correctLabel, ...uniqueDistractors]);
  return { prompt, choices, correctIndex: choices.indexOf(correctLabel), explanation };
}

// ===================================================================
// NUMBER STRAND ("Numeria")
// ===================================================================
const numberGens = {
  5: () => {
    const type = pick(['mul', 'div', 'fracAdd', 'decCompare', 'decSub']);
    if (type === 'mul') {
      const a = randInt(12, 89), b = randInt(2, 9);
      const correct = a * b;
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-10,-9,-6,-4,-2,2,4,6,9,10])*pick([1,1,2]), String);
      return { prompt: `What is ${a} × ${b}?`, choices, correctIndex, explanation: `${a} × ${b} = ${correct}. Try breaking ${a} into tens and ones: (${Math.floor(a/10)*10} × ${b}) + (${a%10} × ${b}).` };
    }
    if (type === 'div') {
      const b = randInt(2, 9), q = randInt(11, 40), a = b * q;
      const { choices, correctIndex } = makeChoices(q, () => q + pick([-3,-2,-1,1,2,3]), String);
      return { prompt: `What is ${a} ÷ ${b}?`, choices, correctIndex, explanation: `${a} ÷ ${b} = ${q}, since ${b} × ${q} = ${a}.` };
    }
    if (type === 'fracAdd') {
      const d = pick([4, 5, 8, 10]);
      let n1 = randInt(1, d - 2), n2 = randInt(1, d - n1 - 1);
      const num = n1 + n2;
      const correct = `${num}/${d}`;
      const { choices, correctIndex } = makeChoices(num, () => num + pick([-2,-1,1,2]), n => `${n}/${d}`);
      return { prompt: `What is ${n1}/${d} + ${n2}/${d}?`, choices, correctIndex, explanation: `Same denominator, so add the numerators: ${n1} + ${n2} = ${num}. Answer: ${num}/${d}.` };
    }
    if (type === 'decCompare') {
      let a = round2(randInt(10, 999) / 100), b = round2(randInt(10, 999) / 100);
      while (Math.abs(a - b) < 0.02) b = round2(randInt(10, 999) / 100);
      const bigger = a > b ? a : b;
      return mcq(`Which decimal is greater: ${a.toFixed(2)} or ${b.toFixed(2)}?`, bigger.toFixed(2), [(a===bigger?b:a).toFixed(2)], `Compare digit by digit from the left. ${bigger.toFixed(2)} is greater.`);
    }
    // decSub
    let a = round2(randInt(200, 999) / 100), b = round2(randInt(10, Math.round(a*100)-10) / 100);
    const correct = round2(a - b);
    const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-0.1,-0.05,0.05,0.1,0.2])), n => n.toFixed(2));
    return { prompt: `What is ${a.toFixed(2)} − ${b.toFixed(2)}?`, choices, correctIndex, explanation: `${a.toFixed(2)} − ${b.toFixed(2)} = ${correct.toFixed(2)}. Line up the decimal points and subtract.` };
  },
  6: () => {
    const type = pick(['intCompare', 'percentOf', 'ratio', 'orderOps']);
    if (type === 'intCompare') {
      let a = randInt(-20, 20), b = randInt(-20, 20);
      while (a === b) b = randInt(-20, 20);
      const bigger = Math.max(a, b);
      return mcq(`Which integer is greater: ${a} or ${b}?`, String(bigger), [String(a===bigger?b:a)], `On a number line, numbers get larger moving right. ${bigger} is farther right than ${a===bigger?b:a}.`);
    }
    if (type === 'percentOf') {
      const pct = pick([10, 20, 25, 50, 75]);
      const base = pick([20, 40, 60, 80, 120, 200]);
      const correct = (pct / 100) * base;
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-10,-5,5,10,15]), String);
      return { prompt: `What is ${pct}% of ${base}?`, choices, correctIndex, explanation: `${pct}% means ${pct}/100. ${pct}/100 × ${base} = ${correct}.` };
    }
    if (type === 'ratio') {
      const a = randInt(2, 6), b = randInt(2, 6);
      const k = randInt(2, 5);
      const correct = b * k;
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-4,-3,-2,2,3,4]), String);
      return { prompt: `${a}:${b} is equivalent to ${a*k}:?`, choices, correctIndex, explanation: `Multiply both terms by ${k}: ${a}×${k}=${a*k} and ${b}×${k}=${correct}.` };
    }
    // orderOps
    const a = randInt(2, 9), b = randInt(2, 9), c = randInt(2, 9);
    const correct = a + b * c;
    const { choices, correctIndex } = makeChoices(correct, () => (a+b)*c + pick([-3,0,3]), String);
    return { prompt: `What is ${a} + ${b} × ${c}? (remember order of operations)`, choices, correctIndex, explanation: `Multiply first: ${b} × ${c} = ${b*c}. Then add: ${a} + ${b*c} = ${correct}.` };
  },
  7: () => {
    const type = pick(['intAddSub', 'intMulDiv', 'convert', 'exponent']);
    if (type === 'intAddSub') {
      const a = randInt(-15, 15), b = randInt(-15, 15);
      const op = pick(['+', '-']);
      const correct = op === '+' ? a + b : a - b;
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-4,-2,2,4,6]), String);
      return { prompt: `What is ${a} ${op} ${pn(b)}?`, choices, correctIndex, explanation: `${a} ${op} ${pn(b)} = ${correct}. Watch your sign when ${op === '-' ? 'subtracting a negative flips it to addition' : 'adding negatives'}.` };
    }
    if (type === 'intMulDiv') {
      const a = randInt(-12, 12) || 3, b = pick([-6,-5,-4,-3,-2,2,3,4,5,6]);
      const correct = a * b;
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-6,-4,4,6]), String);
      return { prompt: `What is ${a} × ${pn(b)}?`, choices, correctIndex, explanation: `Multiply the numbers: ${Math.abs(a)}×${Math.abs(b)}=${Math.abs(correct)}. Same signs give a positive answer, different signs give a negative — so ${a} × ${pn(b)} = ${correct}.` };
    }
    if (type === 'convert') {
      const table = [[1,4,'25%','0.25'],[1,2,'50%','0.5'],[3,4,'75%','0.75'],[1,5,'20%','0.2'],[1,10,'10%','0.1'],[3,5,'60%','0.6'],[2,5,'40%','0.4']];
      const [n,d,pctLabel,decLabel] = pick(table);
      const askPercent = pick([true, false]);
      if (askPercent) return mcq(`What is ${n}/${d} written as a percent?`, pctLabel, shuffle(table.filter(t=>t[2]!==pctLabel).map(t=>t[2])).slice(0,3), `${n}/${d} = ${decLabel} = ${pctLabel}.`);
      return mcq(`What is ${n}/${d} written as a decimal?`, decLabel, shuffle(table.filter(t=>t[3]!==decLabel).map(t=>t[3])).slice(0,3), `Divide ${n} by ${d} to get ${decLabel}.`);
    }
    // exponent
    const base = randInt(2, 9), exp = pick([2, 3]);
    const correct = Math.pow(base, exp);
    const { choices, correctIndex } = makeChoices(correct, () => base * exp + pick([-2,0,2,4]), String);
    return { prompt: `What is ${base}${exp === 2 ? '²' : '³'}?`, choices, correctIndex, explanation: `${base}${exp===2?'²':'³'} means ${Array(exp).fill(base).join(' × ')} = ${correct}.` };
  },
  8: () => {
    const type = pick(['sqrt', 'discount', 'tax', 'simpleInterest']);
    if (type === 'sqrt') {
      const roots = [4,5,6,7,8,9,10,11,12];
      const r = pick(roots);
      const correct = r * r;
      const { choices, correctIndex } = makeChoices(r, () => r + pick([-2,-1,1,2]), String);
      return { prompt: `What is √${correct}?`, choices, correctIndex, explanation: `√${correct} = ${r}, because ${r} × ${r} = ${correct}.` };
    }
    if (type === 'discount') {
      const price = pick([20,30,40,50,60,80,100,120]);
      const pct = pick([10,15,20,25,30]);
      const correct = round2(price - (pct/100)*price);
      const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-5,-3,3,5,8])), fmtMoney);
      return { prompt: `A $${price} game is on sale for ${pct}% off. What's the sale price?`, choices, correctIndex, explanation: `${pct}% of $${price} is $${round2((pct/100)*price)}. $${price} − $${round2((pct/100)*price)} = $${correct}.` };
    }
    if (type === 'tax') {
      const price = pick([10,15,20,25,40,50,60]);
      const taxPct = pick([5,8,13]);
      const correct = round2(price + (taxPct/100)*price);
      const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-3,-2,2,3,5])), fmtMoney);
      return { prompt: `An item costs $${price} plus ${taxPct}% tax. What's the total cost?`, choices, correctIndex, explanation: `Tax = ${taxPct}% of $${price} = $${round2((taxPct/100)*price)}. Total = $${price} + $${round2((taxPct/100)*price)} = $${correct}.` };
    }
    // simple interest
    const P = pick([100,200,300,500]);
    const r = pick([2,4,5,10]);
    const t = pick([1,2,3]);
    const correct = round2(P * (r/100) * t);
    const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-10,-5,5,10,15])), fmtMoney);
    return { prompt: `Find the simple interest: Principal $${P}, rate ${r}%/year, time ${t} year${t>1?'s':''}. (I = P × r × t)`, choices, correctIndex, explanation: `I = P × r × t = $${P} × ${r/100} × ${t} = $${correct}.` };
  },
  9: () => {
    const type = pick(['multiStep', 'simplify', 'percentChange']);
    if (type === 'multiStep') {
      const price = pick([40,50,60,80]);
      const discPct = pick([20,25,30]);
      const taxPct = pick([5,8]);
      const afterDisc = round2(price - (discPct/100)*price);
      const correct = round2(afterDisc + (taxPct/100)*afterDisc);
      const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-4,-2,2,4,6])), fmtMoney);
      return { prompt: `A $${price} jacket is ${discPct}% off, then ${taxPct}% tax is added to the sale price. What's the final price?`, choices, correctIndex, explanation: `Sale price: $${price} − ${discPct}% = $${afterDisc}. Add ${taxPct}% tax: $${afterDisc} × ${1+taxPct/100} = $${correct}.` };
    }
    if (type === 'simplify') {
      const a = randInt(2, 8), b = randInt(2, 8);
      const correctStr = `${a + b}x`;
      const distractors = [`${a * b}x`, `${a + b}x²`, `${Math.abs(a - b)}x`];
      return mcq(`Simplify: ${a}x + ${b}x`, correctStr, distractors, `Combine like terms by adding the coefficients: ${a} + ${b} = ${a + b}, so the answer is ${a+b}x.`);
    }
    // percentChange
    const before = pick([40,50,60,80,100]);
    const after = round2(before * pick([1.1,1.2,1.25,0.8,0.75,0.9]));
    const change = round2(((after - before) / before) * 100);
    const correct = Math.round(change);
    const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-10,-5,5,10]), n => `${n > 0 ? '+' : ''}${n}%`);
    return { prompt: `A price went from $${before} to $${after.toFixed(2)}. What is the percent change?`, choices, correctIndex, explanation: `Percent change = (new − old) ÷ old × 100 = (${after.toFixed(2)} − ${before}) ÷ ${before} × 100 ≈ ${correct}%.` };
  }
};

// ===================================================================
// ALGEBRA STRAND ("Pattern Peaks")
// ===================================================================
const algebraGens = {
  5: () => {
    const type = pick(['nextTerm', 'rule', 'oneStepSymbol']);
    if (type === 'nextTerm') {
      const start = randInt(2, 10), step = randInt(2, 9);
      const seq = [start, start+step, start+2*step, start+3*step];
      const correct = start + 4*step;
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-step+1, -2, 2, step-1, step+1]), String);
      return { prompt: `What comes next in the pattern? ${seq.join(', ')}, ___`, choices, correctIndex, explanation: `The pattern increases by ${step} each time. ${seq[3]} + ${step} = ${correct}.` };
    }
    if (type === 'rule') {
      const step = randInt(2, 8);
      const start = randInt(1, 6);
      const seq = [start, start+step, start+2*step, start+3*step];
      return mcq(`What is the rule for this pattern? ${seq.join(', ')}, ...`, `start at ${start}, add ${step} each time`, [`start at ${start}, add ${step+1} each time`, `start at ${start}, multiply by ${step} each time`, `start at ${start+1}, add ${step} each time`], `Each term is ${step} more than the one before it, starting from ${start}.`);
    }
    // oneStepSymbol
    const b = randInt(2, 20), total = randInt(b+1, b+20);
    const correct = total - b;
    const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-3,-2,-1,1,2,3]), String);
    return { prompt: `Solve for ▢: ▢ + ${b} = ${total}`, choices, correctIndex, explanation: `Subtract ${b} from both sides: ${total} − ${b} = ${correct}.` };
  },
  6: () => {
    const type = pick(['solveVar', 'expression', 'evaluate']);
    if (type === 'solveVar') {
      const k = randInt(2, 9), x = randInt(2, 12);
      const total = k * x;
      const { choices, correctIndex } = makeChoices(x, () => x + pick([-3,-2,-1,1,2,3]), String);
      return { prompt: `Solve for x: ${k}x = ${total}`, choices, correctIndex, explanation: `Divide both sides by ${k}: x = ${total} ÷ ${k} = ${x}.` };
    }
    if (type === 'expression') {
      const step = randInt(2, 7);
      return mcq(`A pattern starts at 0 and adds ${step} each time. Which expression gives the value at position n?`, `${step} × n`, [`n × n`, `${step} + n`, `n ÷ ${step}`], `Each position n is ${step} groups of the step size, so the expression is ${step} × n.`);
    }
    // evaluate
    const coef = randInt(2, 9), x = randInt(1, 10), c = randInt(1, 15);
    const correct = coef * x + c;
    const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-5,-3,3,5,7]), String);
    return { prompt: `Evaluate ${coef}x + ${c} when x = ${x}.`, choices, correctIndex, explanation: `${coef} × ${x} + ${c} = ${coef*x} + ${c} = ${correct}.` };
  },
  7: () => {
    const type = pick(['twoStep', 'tableValue', 'inputOutput']);
    if (type === 'twoStep') {
      const a = randInt(2, 9), x = randInt(2, 12), b = randInt(1, 20);
      const total = a * x + b;
      const { choices, correctIndex } = makeChoices(x, () => x + pick([-3,-2,-1,1,2,3]), String);
      return { prompt: `Solve for x: ${a}x + ${b} = ${total}`, choices, correctIndex, explanation: `Subtract ${b}: ${a}x = ${total-b}. Divide by ${a}: x = ${x}.` };
    }
    if (type === 'tableValue') {
      const m = randInt(2, 6), b = randInt(0, 10);
      const xIn = randInt(2, 10);
      const correct = m * xIn + b;
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-4,-2,2,4,6]), String);
      return { prompt: `A relationship follows y = ${m}x + ${b}. What is y when x = ${xIn}?`, choices, correctIndex, explanation: `y = ${m} × ${xIn} + ${b} = ${m*xIn} + ${b} = ${correct}.` };
    }
    // inputOutput
    const m = randInt(2, 5);
    const inputs = [1,2,3,4];
    const outputs = inputs.map(i => i * m);
    const testIn = 5;
    const correct = testIn * m;
    const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-m,-2,2,m]), String);
    return { prompt: `An input-output machine: in ${inputs.join(',')} → out ${outputs.join(',')}. What comes out if you put in ${testIn}?`, choices, correctIndex, explanation: `Each output is ${m} × the input. ${m} × ${testIn} = ${correct}.` };
  },
  8: () => {
    const type = pick(['bothSides', 'slope', 'linearVsNot']);
    if (type === 'bothSides') {
      // Construct A x + Bc = C x + Dc so that x = X comes out to a clean integer.
      const A = randInt(4, 9), C = randInt(1, A - 1);
      const X = randInt(2, 10);
      const Bc = randInt(1, 15);
      const Dc = (A - C) * X + Bc;
      const { choices, correctIndex } = makeChoices(X, () => X + pick([-3,-2,-1,1,2,3]), String);
      return { prompt: `Solve for x: ${A}x + ${Bc} = ${C}x + ${Dc}`, choices, correctIndex, explanation: `Subtract ${C}x from both sides: ${A-C}x + ${Bc} = ${Dc}. Subtract ${Bc}: ${A-C}x = ${Dc-Bc}. Divide by ${A-C}: x = ${X}.` };
    }
    if (type === 'slope') {
      const x1 = randInt(0, 5), y1 = randInt(0, 10);
      const m = pick([1,2,3,-1,-2,-3]);
      const dx = randInt(1, 5);
      const x2 = x1 + dx, y2 = y1 + m * dx;
      const correct = m;
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-2,-1,1,2]), String);
      return { prompt: `Find the slope between (${x1}, ${y1}) and (${x2}, ${y2}).`, choices, correctIndex, explanation: `Slope = (y₂−y₁)/(x₂−x₁) = (${y2}−${y1})/(${x2}−${x1}) = ${y2-y1}/${dx} = ${m}.` };
    }
    // linearVsNot
    const isLinear = pick([true, false]);
    if (isLinear) {
      const m = randInt(2, 5);
      const rows = [1,2,3,4].map(x => `x=${x}, y=${m*x}`);
      return mcq(`Look at the table: ${rows.join(' | ')}. Is this relationship linear or non-linear?`, 'linear', ['non-linear'], `Each time x increases by 1, y increases by the same amount (${m}), so the relationship is linear.`);
    } else {
      const rows = [1,2,3,4].map(x => `x=${x}, y=${x*x}`);
      return mcq(`Look at the table: ${rows.join(' | ')}. Is this relationship linear or non-linear?`, 'non-linear', ['linear'], `The amount y increases by changes each time (not a constant difference), so this relationship is non-linear.`);
    }
  },
  9: () => {
    const type = pick(['likeTerms', 'fractionEq', 'slopeIntercept']);
    if (type === 'likeTerms') {
      const a = randInt(2, 9), b = randInt(2, 9), c = randInt(1, 9), d = randInt(1, 9);
      const correctCoefX = a + b, correctConst = c - d;
      const correct = `${correctCoefX}x ${correctConst >= 0 ? '+' : '−'} ${Math.abs(correctConst)}`;
      const distractors = [`${a+b}x ${(c+d)>=0?'+':'−'} ${Math.abs(c+d)}`, `${a-b}x ${correctConst>=0?'+':'−'} ${Math.abs(correctConst)}`, `${correctCoefX}x`];
      return mcq(`Simplify: ${a}x + ${c} + ${b}x − ${d}`, correct, distractors, `Combine the x-terms: ${a}x + ${b}x = ${correctCoefX}x. Combine the constants: ${c} − ${d} = ${correctConst}. Result: ${correct}.`);
    }
    if (type === 'fractionEq') {
      const x = randInt(2, 10) * 2; // keep even for clean /2
      const half = x / 2;
      const b = randInt(1, 10);
      const total = half + b;
      const { choices, correctIndex } = makeChoices(x, () => x + pick([-4,-2,2,4]), String);
      return { prompt: `Solve for x: x/2 + ${b} = ${total}`, choices, correctIndex, explanation: `Subtract ${b}: x/2 = ${half}. Multiply both sides by 2: x = ${x}.` };
    }
    // slopeIntercept
    const m = randInt(2, 6), b = randInt(-8, 8);
    const bLabel = b >= 0 ? `+ ${b}` : `− ${Math.abs(b)}`;
    return mcq(`In the equation y = ${m}x ${bLabel}, what is the slope?`, String(m), [String(b), String(m + b), String(-m)], `In y = mx + b form, the coefficient of x is the slope. Here that's ${m}.`);
  }
};

// ===================================================================
// SPATIAL SENSE STRAND ("Shape Shores") — geometry & measurement
// ===================================================================
const spatialGens = {
  5: () => {
    const type = pick(['areaRect', 'areaTri', 'classify3D', 'angleClassify']);
    if (type === 'areaRect') {
      const l = randInt(4, 20), w = randInt(3, 15);
      const correct = l * w;
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-l,-w,l,w,4]), String);
      return { prompt: `A rectangle is ${l} cm by ${w} cm. What is its area?`, choices, correctIndex, explanation: `Area of a rectangle = length × width = ${l} × ${w} = ${correct} cm².` };
    }
    if (type === 'areaTri') {
      const b = randInt(4, 20) * 2, h = randInt(3, 15);
      const correct = (b * h) / 2;
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-4,-2,2,4,6]), String);
      return { prompt: `A triangle has base ${b} cm and height ${h} cm. What is its area?`, choices, correctIndex, explanation: `Area of a triangle = (base × height) ÷ 2 = (${b} × ${h}) ÷ 2 = ${correct} cm².` };
    }
    if (type === 'classify3D') {
      const shapes = [['cube','6 flat square faces'],['rectangular prism','6 flat rectangular faces'],['triangular prism','2 triangular faces and 3 rectangular faces'],['square pyramid','1 square base and 4 triangular faces'],['cylinder','2 circular faces and 1 curved surface'],['cone','1 circular face and 1 curved surface that meets at a point']];
      const [name, desc] = pick(shapes);
      const others = shuffle(shapes.filter(s => s[0] !== name)).slice(0, 3).map(s => s[0]);
      return mcq(`Which 3D figure has ${desc}?`, name, others, `A ${name} is defined by having ${desc}.`);
    }

    const opts = ['acute', 'right', 'obtuse'].filter(o => o !== label);
    return mcq(`An angle measures ${deg}°. Is it acute, right, or obtuse?`, label, opts, `Acute angles are under 90°, right angles are exactly 90°, and obtuse angles are over 90° (but under 180°). ${deg}° is ${label}.`);
  },
  6: () => {
    const type = pick(['areaTrap', 'volumePrism', 'angleSum', 'transform']);
    if (type === 'areaTrap') {
      const a = randInt(4, 12), b = randInt(4, 12), h = randInt(3, 10);
      const correct = ((a + b) / 2) * h;
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-6,-3,3,6,9]), String);
      return { prompt: `A trapezoid has parallel sides ${a} cm and ${b} cm, and height ${h} cm. What is its area?`, choices, correctIndex, explanation: `Area of a trapezoid = ((a + b) ÷ 2) × h = ((${a} + ${b}) ÷ 2) × ${h} = ${correct} cm².` };
    }
    if (type === 'volumePrism') {
      const l = randInt(3, 10), w = randInt(2, 8), h = randInt(2, 8);
      const correct = l * w * h;
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-l*w,-h*2,h*2,l*w]), String);
      return { prompt: `A rectangular prism is ${l} cm × ${w} cm × ${h} cm. What is its volume?`, choices, correctIndex, explanation: `Volume = length × width × height = ${l} × ${w} × ${h} = ${correct} cm³.` };
    }
    if (type === 'angleSum') {
      const a = randInt(30, 100), b = randInt(30, 130 - a > 30 ? 130 - a : 31);
      const c = 180 - a - b;
      const { choices, correctIndex } = makeChoices(c, () => c + pick([-10,-5,5,10]), String);
      return { prompt: `A triangle has angles ${a}° and ${b}°. What is the third angle?`, choices, correctIndex, explanation: `The angles in a triangle always add to 180°. 180 − ${a} − ${b} = ${c}°.` };
    }
    // transform
    const moves = [['translation', 'a shape slides to a new position without turning or flipping'],['reflection', 'a shape flips over a line like a mirror image'],['rotation', 'a shape turns around a fixed point']];
    const [name, desc] = pick(moves);
    const others = moves.filter(m => m[0] !== name).map(m => m[0]);
    return mcq(`Which transformation describes this: ${desc}?`, name, others, `That description matches a ${name}.`);
  },
  7: () => {
    const type = pick(['circumference', 'areaCircle', 'volTriPrism', 'scaleFactor']);
    if (type === 'circumference') {
      const r = randInt(2, 12);
      const correct = round2(2 * 3.14 * r);
      const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-4,-2,2,4,6])), n => n.toFixed(2));
      return { prompt: `A circle has radius ${r} cm. What is its circumference? (use π ≈ 3.14)`, choices, correctIndex, explanation: `Circumference = 2 × π × r = 2 × 3.14 × ${r} ≈ ${correct} cm.` };
    }
    if (type === 'areaCircle') {
      const r = randInt(2, 10);
      const correct = round2(3.14 * r * r);
      const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-8,-5,5,8,12])), n => n.toFixed(2));
      return { prompt: `A circle has radius ${r} cm. What is its area? (use π ≈ 3.14)`, choices, correctIndex, explanation: `Area = π × r² = 3.14 × ${r}² = 3.14 × ${r*r} ≈ ${correct} cm².` };
    }
    if (type === 'volTriPrism') {
      const b = randInt(4, 12), h = randInt(3, 10), len = randInt(4, 12);
      const correct = ((b * h) / 2) * len;
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-10,-6,6,10,14]), String);
      return { prompt: `A triangular prism's triangle base has base ${b} cm and height ${h} cm; the prism length is ${len} cm. What is the volume?`, choices, correctIndex, explanation: `Volume = (triangle area) × length = ((${b} × ${h}) ÷ 2) × ${len} = ${correct} cm³.` };
    }
    // scaleFactor
    const orig = randInt(3, 10), factor = pick([2, 3, 4]);
    const correct = orig * factor;
    const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-3,-2,2,3,factor]), String);
    return { prompt: `A shape's side is ${orig} cm. A similar shape is enlarged by a scale factor of ${factor}. What is the matching side length?`, choices, correctIndex, explanation: `Multiply by the scale factor: ${orig} × ${factor} = ${correct} cm.` };
  },
  8: () => {
    const type = pick(['volCylinder', 'surfaceAreaPrism', 'pythagHyp', 'pythagLeg']);
    if (type === 'volCylinder') {
      const r = randInt(2, 8), h = randInt(4, 15);
      const correct = round2(3.14 * r * r * h);
      const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-20,-10,10,20,30])), n => n.toFixed(2));
      return { prompt: `A cylinder has radius ${r} cm and height ${h} cm. What is its volume? (use π ≈ 3.14)`, choices, correctIndex, explanation: `Volume = π × r² × h = 3.14 × ${r*r} × ${h} ≈ ${correct} cm³.` };
    }
    if (type === 'surfaceAreaPrism') {
      const l = randInt(3, 10), w = randInt(2, 8), h = randInt(2, 8);
      const correct = 2 * (l*w + l*h + w*h);
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-10,-6,6,10,16]), String);
      return { prompt: `A rectangular prism is ${l} cm × ${w} cm × ${h} cm. What is its total surface area?`, choices, correctIndex, explanation: `Surface area = 2(lw + lh + wh) = 2(${l*w} + ${l*h} + ${w*h}) = ${correct} cm².` };
    }
    const triples = [[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[7,24,25]];
    const [a, b, c] = pick(triples);
    if (type === 'pythagHyp') {
      const { choices, correctIndex } = makeChoices(c, () => c + pick([-3,-2,2,3]), String);
      return { prompt: `A right triangle has legs ${a} cm and ${b} cm. What is the length of the hypotenuse?`, choices, correctIndex, explanation: `Using a² + b² = c²: ${a}² + ${b}² = ${a*a} + ${b*b} = ${c*c} = c². So c = ${c} cm.` };
    }
    // pythagLeg
    const { choices, correctIndex } = makeChoices(b, () => b + pick([-3,-2,2,3]), String);
    return { prompt: `A right triangle has a leg of ${a} cm and a hypotenuse of ${c} cm. What is the length of the other leg?`, choices, correctIndex, explanation: `Using a² + b² = c²: ${c}² − ${a}² = ${c*c} − ${a*a} = ${b*b} = b². So b = ${b} cm.` };
  },
  9: () => {
    const type = pick(['compositeVol', 'pythagWord', 'surfaceCylinder']);
    if (type === 'compositeVol') {
      const l = randInt(4, 10), w = randInt(3, 8), h = randInt(3, 8);
      const boxVol = l * w * h;
      const r = Math.min(l, w) / 2 || 2;
      const cylH = randInt(2, 6);
      const cylVol = round2(3.14 * r * r * cylH);
      const correct = round2(boxVol + cylVol);
      const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-15,-8,8,15,25])), n => n.toFixed(2));
      return { prompt: `A box (${l}×${w}×${h} cm) has a cylinder (radius ${r} cm, height ${cylH} cm) sitting on top. What is the total volume? (use π ≈ 3.14)`, choices, correctIndex, explanation: `Box volume = ${l}×${w}×${h} = ${boxVol} cm³. Cylinder volume = 3.14 × ${r}² × ${cylH} ≈ ${cylVol} cm³. Total ≈ ${correct} cm³.` };
    }
    const triples = [[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17]];
    const [a, b, c] = pick(triples);
    if (type === 'pythagWord') {
      const { choices, correctIndex } = makeChoices(c, () => c + pick([-3,-2,2,3]), String);
      return { prompt: `A ladder leans against a wall. The base is ${a} m from the wall, and the wall meets the ladder ${b} m up. How long is the ladder?`, choices, correctIndex, explanation: `This forms a right triangle: a² + b² = c². ${a}² + ${b}² = ${c*c}, so the ladder is ${c} m long.` };
    }
    // surfaceCylinder
    const r = randInt(2, 6), h = randInt(4, 12);
    const correct = round2(2 * 3.14 * r * (r + h));
    const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-15,-8,8,15,25])), n => n.toFixed(2));
    return { prompt: `A cylinder has radius ${r} cm and height ${h} cm. What is its total surface area? (use π ≈ 3.14)`, choices, correctIndex, explanation: `Surface area = 2πr(r + h) = 2 × 3.14 × ${r} × (${r} + ${h}) ≈ ${correct} cm².` };
  }
};

// DATA STRAND ("Data Dunes")
// ===================================================================
const dataGens = {
  5: () => {
    const type = pick(['readBar', 'mean', 'range', 'probability']);
    if (type === 'readBar') {
      const days = ['Mon','Tue','Wed','Thu','Fri'];
      const vals = days.map(() => randInt(2, 12));
      const idx = randInt(0, 4);
      const correct = vals[idx];
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-3,-2,2,3]), String);
      return { prompt: `A bar graph shows books read each day: ${days.map((d,i)=>`${d}=${vals[i]}`).join(', ')}. How many books were read on ${days[idx]}?`, choices, correctIndex, explanation: `Read the bar for ${days[idx]}: it shows ${correct} books.` };
    }
    if (type === 'mean') {
      const n = 4;
      const vals = Array.from({length:n}, () => randInt(2, 20));
      const sum = vals.reduce((a,b)=>a+b,0);
      const correct = round2(sum / n);
      const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-2,-1,1,2])), n2 => n2.toFixed(correct % 1 === 0 ? 0 : 2));
      return { prompt: `Find the mean of: ${vals.join(', ')}`, choices, correctIndex, explanation: `Mean = sum ÷ count = ${sum} ÷ ${n} = ${correct}.` };
    }
    if (type === 'range') {
      const vals = Array.from({length:5}, () => randInt(1, 40));
      const correct = Math.max(...vals) - Math.min(...vals);
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-4,-2,2,4]), String);
      return { prompt: `Find the range of: ${vals.join(', ')}`, choices, correctIndex, explanation: `Range = greatest − least = ${Math.max(...vals)} − ${Math.min(...vals)} = ${correct}.` };
    }
    // probability
    const total = randInt(6, 12), favourable = randInt(1, total - 1);
    const g = gcd(favourable, total);
    const correct = `${favourable/g}/${total/g}`;
    const { choices, correctIndex } = makeChoices(favourable, () => randInt(1, total-1), f => { const gg = gcd(f, total); return `${f/gg}/${total/gg}`; });
    return { prompt: `A bag has ${total} marbles, ${favourable} of them blue. What is the probability of picking a blue marble?`, choices, correctIndex, explanation: `Probability = favourable ÷ total = ${favourable}/${total} = ${correct} in simplest form.` };
  },
  6: () => {
    const type = pick(['circleGraph', 'median', 'mode', 'probTwo']);
    if (type === 'circleGraph') {
      const pct = pick([10,20,25,50]);
      const total = pick([40,80,100,200]);
      const correct = (pct/100) * total;
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-10,-5,5,10]), String);
      return { prompt: `A circle graph shows ${pct}% of ${total} students prefer soccer. How many students is that?`, choices, correctIndex, explanation: `${pct}% of ${total} = ${pct}/100 × ${total} = ${correct} students.` };
    }
    if (type === 'median') {
      const vals = Array.from({length:5}, () => randInt(1, 50)).sort((a,b)=>a-b);
      const correct = vals[2];
      const { choices, correctIndex } = makeChoices(correct, () => vals[pick([0,1,3,4])], String);
      return { prompt: `Find the median of: ${shuffle(vals).join(', ')}`, choices, correctIndex, explanation: `Order the values: ${vals.join(', ')}. The middle value is ${correct}.` };
    }
    if (type === 'mode') {
      const base = Array.from({length:4}, () => randInt(1, 15));
      const repeated = pick(base);
      const vals = shuffle([...base, repeated]);
      const { choices, correctIndex } = makeChoices(repeated, () => pick(base.filter(v=>v!==repeated)) ?? repeated+1, String);
      return { prompt: `Find the mode of: ${vals.join(', ')}`, choices, correctIndex, explanation: `The mode is the value that appears most often: ${repeated} appears twice.` };
    }
    // probTwo (coin + die style count of outcomes)
    const sides = pick([4,6]);
    const total = 2 * sides;
    const favourable = sides; // e.g. heads with any die face
    const g = gcd(favourable, total);
    const correct = `${favourable/g}/${total/g}`;
    return mcq(`You flip a coin and roll a ${sides}-sided die. How many equally-likely outcomes are there in total?`, String(total), [String(sides), String(sides+2), String(total+2)], `There are 2 coin outcomes × ${sides} die outcomes = ${total} total equally-likely outcomes.`);
  },
  7: () => {
    const type = pick(['probIndependent', 'scatterTrend', 'samplingBias', 'meanFreqTable']);
    if (type === 'probIndependent') {
      const a = pick([[1,2],[1,4],[1,3],[1,6]]);
      const b = pick([[1,2],[1,4],[1,3]]);
      const correctNum = a[0]*b[0], correctDen = a[1]*b[1];
      const g = gcd(correctNum, correctDen);
      const correct = `${correctNum/g}/${correctDen/g}`;
      const wrong1 = `${a[0]+b[0]}/${a[1]+b[1]}`;
      const wrong2 = `${a[0]}/${a[1]}`;
      const wrong3 = `${b[0]}/${b[1]}`;
      return mcq(`Event A has probability ${a[0]}/${a[1]}, and independent event B has probability ${b[0]}/${b[1]}. What is P(A and B)?`, correct, [wrong1, wrong2, wrong3], `For independent events, multiply the probabilities: ${a[0]}/${a[1]} × ${b[0]}/${b[1]} = ${correct}.`);
    }
    if (type === 'scatterTrend') {
      return mcq(`A scatter plot shows that as hours studied increases, test scores tend to increase too. What kind of relationship is this?`, 'positive correlation', ['negative correlation', 'no correlation', 'a linear equation'], `When both values tend to increase together, that's called a positive correlation.`);
    }
    if (type === 'samplingBias') {
      return mcq(`A student wants to know the favourite subject of the whole school, but only surveys their own math class. What's the main problem?`, `the sample isn't representative of the whole school`, [`the sample size is too large`, `the question is unclear`, `there's no problem at all`], `Only surveying one class leaves out the rest of the school, so the results may not represent everyone.`);
    }
    // meanFreqTable
    const values = [randInt(1,5), randInt(6,10), randInt(11,15)];
    const freqs = [randInt(2,5), randInt(2,5), randInt(1,4)];
    let sum = 0, count = 0;
    for (let i = 0; i < 3; i++) { sum += values[i]*freqs[i]; count += freqs[i]; }
    const correct = round2(sum / count);
    const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-1.5,-1,1,1.5])), n => n.toFixed(2));
    return { prompt: `Frequency table — value ${values[0]} occurs ${freqs[0]} times, value ${values[1]} occurs ${freqs[1]} times, value ${values[2]} occurs ${freqs[2]} times. What is the mean?`, choices, correctIndex, explanation: `Mean = (sum of value×frequency) ÷ total count = ${sum} ÷ ${count} ≈ ${correct}.` };
  },
  8: () => {
    const type = pick(['misleadingGraph', 'boxPlot', 'probCombo', 'weightedAvg']);
    if (type === 'misleadingGraph') {
      return mcq(`A bar graph's vertical axis starts at 80 instead of 0, making small differences between bars look huge. Why is this misleading?`, `it exaggerates the differences between the bars`, [`it makes the bars too colourful`, `it uses too many bars`, `it isn't misleading at all`], `Starting the axis above zero stretches small differences, making them look much bigger than they really are.`);
    }
    if (type === 'boxPlot') {
      return mcq(`In a box-and-whisker plot, what does the line inside the box represent?`, 'the median', ['the mean', 'the range', 'the highest value'], `The line inside the box marks the median — the middle value of the data set.`);
    }
    if (type === 'probCombo') {
      const items = randInt(3, 6);
      const correct = items * (items - 1);
      const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-items, -2, 2, items]), String);
      return { prompt: `You have ${items} different colour shirts and want to pick 2 to wear on different days (order matters — Monday's shirt vs Tuesday's shirt). How many ways can you choose them?`, choices, correctIndex, explanation: `First choice: ${items} options. Second choice: ${items-1} remaining options. ${items} × ${items-1} = ${correct}.` };
    }
    // weightedAvg
    const w1 = randInt(60, 95), n1 = pick([2,3]);
    const w2 = randInt(60, 95), n2 = pick([1,2]);
    const correct = round2((w1*n1 + w2*n2) / (n1+n2));
    const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-3,-2,2,3])), n => n.toFixed(1));
    return { prompt: `A student scores ${w1}% on ${n1} quizzes and ${w2}% on ${n2} quizzes. What is the weighted average?`, choices, correctIndex, explanation: `Weighted average = (${w1}×${n1} + ${w2}×${n2}) ÷ (${n1}+${n2}) = ${w1*n1 + w2*n2} ÷ ${n1+n2} ≈ ${correct}%.` };
  },
  9: () => {
    const type = pick(['critique', 'multiStepProb', 'weightedAvgMulti']);
    if (type === 'critique') {
      return mcq(`A headline says "90% of dentists recommend Brand X!" but doesn't say how many dentists were asked. What question should you ask first?`, `how many dentists were surveyed, and how were they chosen?`, [`what flavour is the toothpaste?`, `how much does Brand X cost?`, `nothing — the statistic speaks for itself`], `A statistic without knowing the sample size or how people were chosen can be misleading — always check the source and sample.`);
    }
    if (type === 'multiStepProb') {
      const a = pick([[1,2],[1,3],[1,4]]);
      const b = pick([[1,2],[1,3]]);
      const c = pick([[1,2],[1,4]]);
      const num = a[0]*b[0]*c[0], den = a[1]*b[1]*c[1];
      const g = gcd(num, den);
      const correct = `${num/g}/${den/g}`;
      const wrongs = [`${a[0]}/${a[1]}`, `${b[0]}/${b[1]}`, `${num}/${den+2}`];
      return mcq(`Three independent events have probabilities ${a[0]}/${a[1]}, ${b[0]}/${b[1]}, and ${c[0]}/${c[1]}. What is the probability all three happen?`, correct, wrongs, `Multiply all three probabilities together: ${a[0]}/${a[1]} × ${b[0]}/${b[1]} × ${c[0]}/${c[1]} = ${correct}.`);
    }
    // weightedAvgMulti
    const parts = [[randInt(60,95), 20],[randInt(60,95), 30],[randInt(60,95), 50]];
    const sum = parts.reduce((s,[score,weight]) => s + score*weight, 0);
    const correct = round2(sum / 100);
    const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-3,-2,2,3])), n => n.toFixed(1));
    return { prompt: `A course grade is ${parts[0][1]}% homework (scored ${parts[0][0]}%), ${parts[1][1]}% tests (scored ${parts[1][0]}%), and ${parts[2][1]}% final exam (scored ${parts[2][0]}%). What is the final grade?`, choices, correctIndex, explanation: `Multiply each score by its weight and add: (${parts.map(([s,w])=>`${s}×${w}`).join(' + ')}) ÷ 100 ≈ ${correct}%.` };
  }
};

// ===================================================================
// FINANCIAL LITERACY STRAND ("Coin Cove")
// ===================================================================
const financialGens = {
  5: () => {
    const type = pick(['needsWants', 'savingsGoal', 'budgetAddSub']);
    if (type === 'needsWants') {
      const needs = ['groceries', 'rent payment', 'winter boots', 'a bus pass to get to school'];
      const wants = ['a video game', 'a movie ticket', 'a new toy', 'candy at the store'];
      const askNeed = pick([true, false]);
      const item = askNeed ? pick(needs) : pick(wants);
      return mcq(`Is "${item}" a need or a want?`, askNeed ? 'need' : 'want', [askNeed ? 'want' : 'need'], `A need is something essential to live, and a want is something nice to have but not essential. "${item}" is a ${askNeed ? 'need' : 'want'}.`);
    }
    if (type === 'savingsGoal') {
      const perWeek = pick([5,10,15,20]);
      const weeks = randInt(3, 10);
      const goal = perWeek * weeks;
      const { choices, correctIndex } = makeChoices(weeks, () => weeks + pick([-2,-1,1,2]), String);
      return { prompt: `You save $${perWeek} a week toward a $${goal} bike. How many weeks until you reach your goal?`, choices, correctIndex, explanation: `$${goal} ÷ $${perWeek} per week = ${weeks} weeks.` };
    }
    // budgetAddSub
    const allowance = randInt(20, 50);
    const spend1 = randInt(3, 10), spend2 = randInt(3, 10);
    const correct = allowance - spend1 - spend2;
    const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-4,-2,2,4]), String);
    return { prompt: `You have $${allowance}. You spend $${spend1} on a snack and $${spend2} on a comic book. How much money do you have left?`, choices, correctIndex, explanation: `$${allowance} − $${spend1} − $${spend2} = $${correct}.` };
  },
  6: () => {
    const type = pick(['unitPrice', 'simpleInterestIntro', 'budgetPercent']);
    if (type === 'unitPrice') {
      const priceA = randInt(3, 10), qtyA = pick([2,3,4,5]);
      const priceB = randInt(3, 12), qtyB = pick([2,3,4,5]);
      const unitA = round2(priceA / qtyA), unitB = round2(priceB / qtyB);
      while (Math.abs(unitA - unitB) < 0.05) { return financialGens[6](); } // retry on tie
      const better = unitA < unitB ? `Pack A ($${priceA} for ${qtyA})` : `Pack B ($${priceB} for ${qtyB})`;
      const worse = unitA < unitB ? `Pack B ($${priceB} for ${qtyB})` : `Pack A ($${priceA} for ${qtyA})`;
      return mcq(`Pack A: $${priceA} for ${qtyA} items. Pack B: $${priceB} for ${qtyB} items. Which is the better deal (lower unit price)?`, better, [worse], `Unit price A = $${unitA.toFixed(2)} each. Unit price B = $${unitB.toFixed(2)} each. ${better} has the lower unit price.`);
    }
    if (type === 'simpleInterestIntro') {
      const P = pick([50,100,150,200]);
      const r = pick([2,4,5]);
      const correct = round2(P * (r/100));
      const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-3,-2,2,3])), fmtMoney);
      return { prompt: `You put $${P} in a savings account earning ${r}% simple interest per year. How much interest do you earn after 1 year?`, choices, correctIndex, explanation: `Interest = Principal × rate = $${P} × ${r}% = $${correct}.` };
    }
    // budgetPercent
    const income = pick([40,60,80,100]);
    const pct = pick([10,20,25]);
    const correct = (pct/100) * income;
    const { choices, correctIndex } = makeChoices(correct, () => correct + pick([-8,-5,5,8]), String);
    return { prompt: `You plan to save ${pct}% of your $${income} birthday money. How much will you save?`, choices, correctIndex, explanation: `${pct}% of $${income} = ${pct}/100 × ${income} = $${correct}.` };
  },
  7: () => {
    const type = pick(['discount', 'tax', 'interestPractice']);
    if (type === 'discount') {
      const price = pick([15,20,25,30,45,60]);
      const pct = pick([10,20,25,30]);
      const correct = round2(price - (pct/100)*price);
      const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-4,-2,2,4,6])), fmtMoney);
      return { prompt: `A $${price} shirt is ${pct}% off. What is the sale price?`, choices, correctIndex, explanation: `Discount = ${pct}% of $${price} = $${round2((pct/100)*price)}. Sale price = $${price} − $${round2((pct/100)*price)} = $${correct}.` };
    }
    if (type === 'tax') {
      const price = pick([12,18,25,35,50]);
      const taxPct = pick([5,8,13]);
      const correct = round2(price * (taxPct/100));
      const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-1.5,-1,1,1.5])), fmtMoney);
      return { prompt: `An item costs $${price}. How much tax do you pay at a rate of ${taxPct}%?`, choices, correctIndex, explanation: `Tax = $${price} × ${taxPct}% = $${correct}.` };
    }
    // interestPractice
    const P = pick([100,200,400,500]);
    const r = pick([3,5,6,8]);
    const t = pick([1,2,3]);
    const correct = round2(P * (r/100) * t);
    const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-10,-5,5,10,15])), fmtMoney);
    return { prompt: `Find the simple interest on $${P} at ${r}% per year for ${t} year${t>1?'s':''}.`, choices, correctIndex, explanation: `I = P × r × t = $${P} × ${r/100} × ${t} = $${correct}.` };
  },
  8: () => {
    const type = pick(['compoundVsSimple', 'grossNet', 'currency']);
    if (type === 'compoundVsSimple') {
      const P = pick([100, 200]);
      const r = pick([5, 10]);
      const simple = round2(P * (r/100) * 2);
      const compound = round2(P * Math.pow(1 + r/100, 2) - P);
      return mcq(`After 2 years, which earns more interest on $${P} at ${r}%/year: simple interest or compound interest?`, 'compound interest', ['simple interest', 'they earn exactly the same'], `Simple interest gives $${simple.toFixed(2)}. Compound interest gives $${compound.toFixed(2)} because year 2 also earns interest on year 1's interest — so compound interest earns more.`);
    }
    if (type === 'grossNet') {
      const gross = pick([400,500,600,800]);
      const deductionPct = pick([10,15,20]);
      const correct = round2(gross - (deductionPct/100)*gross);
      const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-15,-10,10,15,20])), fmtMoney);
      return { prompt: `Your paycheque is $${gross} (gross pay). ${deductionPct}% is deducted for taxes and other deductions. What is your net pay?`, choices, correctIndex, explanation: `Deductions = ${deductionPct}% of $${gross} = $${round2((deductionPct/100)*gross)}. Net pay = $${gross} − $${round2((deductionPct/100)*gross)} = $${correct}.` };
    }
    // currency
    const cad = pick([20,50,100,150]);
    const rate = pick([0.72, 0.74, 0.76, 0.78]);
    const correct = round2(cad * rate);
    const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-5,-3,3,5,8])), fmtMoney);
    return { prompt: `If $1 CAD = $${rate} USD, how much is $${cad} CAD worth in USD?`, choices, correctIndex, explanation: `$${cad} × ${rate} = $${correct} USD.` };
  },
  9: () => {
    const type = pick(['discountThenTax', 'interestYears', 'budgetMulti']);
    if (type === 'discountThenTax') {
      const price = pick([50,60,80,100]);
      const discPct = pick([15,20,25]);
      const taxPct = pick([5,8]);
      const afterDisc = round2(price - (discPct/100)*price);
      const correct = round2(afterDisc + (taxPct/100)*afterDisc);
      const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-5,-3,3,5,8])), fmtMoney);
      return { prompt: `A $${price} item is ${discPct}% off, then ${taxPct}% tax is added. What's the final price?`, choices, correctIndex, explanation: `Sale price: $${price} × ${1-discPct/100} = $${afterDisc}. With tax: $${afterDisc} × ${1+taxPct/100} = $${correct}.` };
    }
    if (type === 'interestYears') {
      const P = pick([200,300,500]);
      const r = pick([4,5,6]);
      const t = 3;
      const correct = round2(P * Math.pow(1 + r/100, t));
      const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-15,-10,10,15,20])), fmtMoney);
      return { prompt: `$${P} is invested at ${r}% compound interest per year for ${t} years. What is the total value? (round to nearest cent)`, choices, correctIndex, explanation: `Value = P × (1 + r)^t = $${P} × (1.0${r < 10 ? '0'+r : r})³ ≈ $${correct}.` };
    }
    // budgetMulti
    const income = pick([300,400,500]);
    const rent = round2(income * 0.3), food = round2(income * 0.2), save = round2(income * 0.15);
    const correct = round2(income - rent - food - save);
    const { choices, correctIndex } = makeChoices(correct, () => round2(correct + pick([-15,-10,10,15,20])), fmtMoney);
    return { prompt: `Monthly income is $${income}. You budget 30% for rent, 20% for food, and 15% for savings. How much is left for everything else?`, choices, correctIndex, explanation: `Rent $${rent} + food $${food} + savings $${save} = $${round2(rent+food+save)}. Remaining = $${income} − $${round2(rent+food+save)} = $${correct}.` };
  }
};

// ===================================================================
async function storageGet(key){
  try { const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function storageSet(key, value){
  try { await window.storage.set(key, JSON.stringify(value), false); return true; }
  catch(e){ console.error('storage set failed', e); return false; }
}
async function storageListKeys(prefix){
  try { const r = await window.storage.list(prefix, false); return r ? r.keys : []; }
  catch(e){ return []; }
}
async function storageDelete(key){
  try { await window.storage.delete(key, false); return true; } catch(e){ return false; }
}

function renderMap(){
  const pr = state.progress;
  return `<div class="screen">
    ${renderTopbar()}
    <div class="map-wrap">
      <div class="center" style="margin-bottom:8px;">
        <h2>Choose a world to practise</h2>
        <p class="muted">Each lesson has ${LESSON_LENGTH} questions and ${HEARTS_MAX} hearts. Answer well and you'll level up fast.</p>
      </div>

        <span class="ii">💡</span>

      </div>
      <div class="node-grid" style="margin-top:18px;">
        ${STRANDS.map(s => {
          const grade = pr.strandGrade[s.key];
          const segments = GRADES.length; // 5 segments, one per grade 5-9
          const filled = grade - 5; // 0..4 fully completed segments
          const up = pr.strandStreakUp[s.key];
          const upFrac = up / LEVEL_UP_STREAK; // progress into current segment
          const stops = [];
          for (let i = 0; i < segments; i++){
            const segStart = (i / segments) * 360, segEnd = ((i+1) / segments) * 360;
            const segFillFrac = i < filled ? 1 : (i === filled ? upFrac : 0);
            const segFillEnd = segStart + (segEnd - segStart) * segFillFrac;
            if (segFillFrac > 0) stops.push(`${s.color} ${segStart}deg ${segFillEnd}deg`);
            stops.push(`#E5E5E5 ${segFillEnd}deg ${segEnd - 3}deg`, `#fff ${segEnd - 3}deg ${segEnd}deg`);
          }
          const ring = `conic-gradient(${stops.join(',')})`;
          const maxed = grade >= 9 && up === 0 && filled === 4;
          const caption = maxed ? 'Challenge mastered!' : `${up}/${LEVEL_UP_STREAK} correct in a row to level up`;
          return `
          <button class="skill-card" data-action="enter-strand" data-strand="${s.key}">
            <div class="skill-node">
              <div class="ring" style="background:${ring};"></div>
              <div class="hole">${s.icon}</div>
              ${maxed ? `<span class="skill-crown">👑</span>` : ''}
            </div>
            <div class="skill-info">
              <div class="skill-name">${s.name}</div>
              <div class="skill-tagline">${s.tagline}</div>
              <span class="skill-grade-pill" style="background:${s.soft}; color:${s.deep};">${gradeLabel(grade)}</span>
              <div class="skill-caption">${caption}</div>
            </div>
          </button>`;
        }).join('')}
      </div>
    </div>
    ${renderBottomTabs('map')}
  </div>`;
}

  const lessonPct = Math.round((les.index / les.total) * 100);
  const hearts = Array.from({length:HEARTS_MAX}, (_,i) => `<span class="${i < les.hearts ? '' : 'heart-lost'}">❤️</span>`).join('');

  const showBottomBar = state.phase === 'checked';
  const isCorrect = state.selectedChoice === q.correctIndex;

  return `<div class="screen">
    <div class="quest-header">
      <button class="quit-x" data-action="quit-lesson" aria-label="Quit lesson">✕</button>

            if (i === q.correctIndex) cls += ' correct';
            else if (i === state.selectedChoice) cls += ' incorrect';
            else cls += ' faded';
          } else if (i === state.selectedChoice){
            cls += ' selected';
          }
          return `<button class="${cls}" data-action="select-choice" data-idx="${i}" ${state.phase === 'checked' ? 'disabled' : ''}>${c}</button>`;
        }).join('')}

    </div>

    <div class="bottom-bar ${showBottomBar ? (isCorrect ? 'state-good' : 'state-bad') : ''}">
