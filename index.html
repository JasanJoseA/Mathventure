        ${showBottomBar ? `
          <div class="bottom-feedback">
            <span style="font-size:1.6rem;">${isCorrect ? '✅' : '❌'}</span>
            <div>
              <div class="headline">${isCorrect ? 'Nicely done!' : "Not quite"}</div>
              <div class="sub"><strong>How to solve it:</strong> ${q.explanation} ${!isCorrect ? `The correct answer is ${q.choices[q.correctIndex]}.` : ''}</div>
            </div>
          </div>
          <button class="btn ${isCorrect ? 'btn-primary' : 'btn-coral'} btn-lg" data-action="continue-lesson">Continue</button>
        ` : `
          <span class="muted" style="font-weight:700;">${state.selectedChoice === null ? 'Pick an answer' : ''}</span>
          <button class="btn btn-primary btn-lg" data-action="check-answer" ${state.selectedChoice === null ? 'disabled' : ''}>Check</button>
        `}
      </div>
    </div>
  </div>`;
}

// ===================================================================
// SCREEN: LESSON COMPLETE
// ===================================================================
function renderLessonComplete(){
  const les = state.lesson;
  const s = strandByKey(les.strand);
  const accuracy = les.index ? Math.round((les.correctCount / les.index) * 100) : 0;
  const bailedEarly = les.hearts <= 0;
  return `<div class="screen">
    <div class="complete-hero">
      <div class="big-emoji">${bailedEarly ? '💪' : '🎉'}</div>
      <h2 style="margin-top:10px;">${bailedEarly ? 'Good effort!' : 'Lesson complete!'}</h2>
      <p class="muted" style="margin-top:6px;">${s.icon} ${s.name} · ${gradeLabel(state.progress.strandGrade[les.strand])}</p>
      <div class="complete-stats">
        <div class="complete-stat"><div class="val" style="color:var(--gold-deep);">+${les.xpEarned}</div><div class="lab">XP earned</div></div>
        <div class="complete-stat"><div class="val" style="color:var(--blue-deep);">+${les.gemsEarned}</div><div class="lab">Gems earned</div></div>
        <div class="complete-stat"><div class="val" style="color:var(--green-deep);">${accuracy}%</div><div class="lab">Accuracy</div></div>
      </div>
      <div class="spacer-24"></div>
      <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-primary btn-lg" data-action="enter-strand" data-strand="${les.strand}">Practise Again</button>
        <button class="btn btn-outline btn-lg" data-action="go-map">Back to Map</button>
      </div>
    </div>
  </div>`;
}

// ===================================================================
// SCREEN: DASHBOARD
// ===================================================================
function renderDashboard(){
  const pr = state.progress;
  const accuracy = pr.totalAnswered ? Math.round((pr.totalCorrect / pr.totalAnswered) * 100) : 0;
  const weakest = STRANDS.slice().sort((a,b) => pr.strandGrade[a.key] - pr.strandGrade[b.key])[0];
  const mistakes = (pr.mistakes || []).slice(0, 6);
  return `<div class="screen">
    ${renderTopbar()}
    <h2>Your Progress</h2>
    <p class="muted">A snapshot for you (or a parent/teacher) to see how things are going.</p>

    <div class="dash-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin-top:16px;">
      <div class="card center"><div style="font-size:1.6rem; font-family:var(--font-display); font-weight:800;">${overallGradeEstimate(pr)}</div><div class="muted" style="font-size:.8rem;">Overall grade level</div></div>
      <div class="card center"><div style="font-size:1.6rem; font-family:var(--font-display); font-weight:800;">${pr.totalAnswered}</div><div class="muted" style="font-size:.8rem;">Questions answered</div></div>
      <div class="card center"><div style="font-size:1.6rem; font-family:var(--font-display); font-weight:800;">${accuracy}%</div><div class="muted" style="font-size:.8rem;">Accuracy</div></div>
      <div class="card center"><div style="font-size:1.6rem; font-family:var(--font-display); font-weight:800;">${pr.bestStreak}</div><div class="muted" style="font-size:.8rem;">Best streak</div></div>
    </div>

    <div class="section-title">By world</div>
    <p class="muted" style="font-size:.85rem; margin-top:-2px;">The bar shows how far each world has come from Grade 5 to the Grade 9 challenge.</p>
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
      ${STRANDS.map(s => {
        const grade = pr.strandGrade[s.key];
        const gpct = Math.round(((grade - 5) / 4) * 100);
        const answered = pr.strandAnswered[s.key] || 0;
        const correct = pr.strandCorrect[s.key] || 0;
        const acc = answered ? Math.round((correct/answered)*100) : 0;
        return `<div class="strand-row">
          <div class="strand-icon" style="background:${s.soft};">${s.icon}</div>
          <div style="flex:1; min-width:0;">
            <div class="row-between"><strong>${s.name}</strong><span class="muted" style="font-size:.82rem;">${gradeLabel(grade)}</span></div>
            <div class="progress-track" style="margin:8px 0 4px;"><div class="progress-fill" style="width:${gpct}%; background:${s.color};"></div></div>
            <div class="muted" style="font-size:.76rem;">${answered} answered · ${acc}% correct</div>
          </div>
          <button class="btn btn-sm" style="background:${s.color}; color:#fff;" data-action="enter-strand" data-strand="${s.key}">Practise</button>
        </div>`;
      }).join('')}
    </div>

    <div class="section-title">Mistake training</div>
    <p class="muted" style="font-size:.85rem; margin-top:-2px;">Review the questions you missed, then practise the world that needs the most attention.</p>
    ${mistakes.length ? `<div class="mistake-list">
      ${mistakes.map(m => `<div class="mistake-item">
        <div class="mistake-question">${escapeHtml(m.prompt)}</div>
        <div class="mistake-detail">${escapeHtml(m.strandName)} · Your answer: ${escapeHtml(m.selected)} · Correct: ${escapeHtml(m.correct)}</div>
        <div class="mistake-detail"><strong>Tip:</strong> ${escapeHtml(m.explanation)}</div>
      </div>`).join('')}
    </div>
    <button class="btn btn-coral btn-block" style="margin-top:12px;" data-action="start-training">🎯 Practise my mistakes</button>`
    : `<div class="info-banner"><span class="ii">✨</span><span>Your mistake notebook is empty. Answer a few questions and missed answers will appear here with tips.</span></div>`}

    ${weakest ? `<div class="card" style="margin-top:18px; background:#FFF6DA;"><strong>Suggested focus:</strong> ${weakest.name} could use a little more practice right now.</div>` : ''}

    <div class="section-title">Badges</div>
    <p class="muted" style="font-size:.85rem; margin-top:-2px;">One-time achievements — hover or tap one to see what it takes.</p>
    <div class="badge-grid">
      ${BADGES.map(b => {
        const earned = pr.badges.includes(b.id);
        return `<div class="badge-tile ${earned ? '' : 'locked'}" title="${escapeHtml(b.desc)}">
          <div class="b-icon">${b.icon}</div>
          <div class="b-name">${b.name}</div>
        </div>`;
      }).join('')}
    </div>
    ${renderBottomTabs('dashboard')}
  </div>`;
}

// ===================================================================
// SCREEN: QUESTS — ongoing challenges (separate from one-time badges)
// ===================================================================
function renderQuests(){
  const pr = state.progress;
  return `<div class="screen">
    ${renderTopbar()}
    <h2>Quests</h2>
    <p class="muted">Bonus challenges that reward extra XP and gems as you practise — no need to do anything special, just keep playing and watch these fill up.</p>
    <div style="display:flex; flex-direction:column; gap:12px; margin-top:16px;">
      ${QUESTS.map(q => {
        const cur = q.progress(pr);
        const done = pr.questsCompleted.includes(q.id);
        const pct = Math.round((cur / q.target) * 100);
        return `<div class="card" style="display:flex; align-items:center; gap:14px;">
          <div style="width:46px;height:46px;border-radius:14px;background:${done ? '#D7FFB8' : '#F0F0F0'};display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;">${done ? '✅' : q.icon}</div>
          <div style="flex:1; min-width:0;">
            <div class="row-between"><strong>${q.name}</strong><span class="muted" style="font-size:.78rem;">${Math.min(cur,q.target)}/${q.target}</span></div>
            <div class="muted" style="font-size:.82rem; margin:2px 0 8px;">${q.desc}</div>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${done ? 'var(--green)' : 'var(--blue)'};"></div></div>
          </div>
          <div class="pill pill-xp" style="flex-shrink:0;" title="Reward for finishing this quest">+${q.xp}⚡</div>
        </div>`;
      }).join('')}
    </div>
    ${renderBottomTabs('quests')}
  </div>`;
}

// ===================================================================
// SCREEN: PROFILE
// ===================================================================
function renderProfileScreen(){
  const p = state.profile, pr = state.progress;
  return `<div class="screen">
    <div class="center" style="padding:20px 0 6px;">
      ${avatarHtml(p, 110)}
      <h2 style="margin-top:14px;">${escapeHtml(p.name)}</h2>
      <p class="muted">Overall: Grade ${overallGradeEstimate(pr)}</p>
    </div>
    <div class="dash-grid" style="grid-template-columns:repeat(3,1fr); margin-top:10px; max-width:420px; margin-left:auto; margin-right:auto;">
      <div class="card center"><div style="font-size:1.3rem; font-family:var(--font-display); font-weight:800; color:var(--gold-deep);">${pr.xp}</div><div class="muted" style="font-size:.74rem;">XP</div></div>
      <div class="card center"><div style="font-size:1.3rem; font-family:var(--font-display); font-weight:800; color:var(--blue-deep);">${pr.coins}</div><div class="muted" style="font-size:.74rem;">Gems</div></div>
      <div class="card center"><div style="font-size:1.3rem; font-family:var(--font-display); font-weight:800; color:#E0670C;">${pr.bestStreak}</div><div class="muted" style="font-size:.74rem;">Best streak</div></div>
    </div>

    <div class="panel" style="max-width:420px; margin:24px auto 0;">
      <button class="btn btn-outline btn-block" data-action="edit-avatar">✏️ Edit Avatar &amp; Name</button>
      <div class="spacer-16"></div>
      <button class="btn btn-outline btn-block" data-action="switch-profile">👤 Switch Profile</button>
      <div class="spacer-16"></div>
      <button class="btn btn-outline btn-block" data-action="reset-progress" style="color:var(--warn);">🗑️ Reset Progress</button>
      <p class="muted" style="font-size:.78rem; text-align:center; margin-top:10px;">Resetting clears XP, gems, grade levels and badges for ${escapeHtml(p.name)}. This can't be undone.</p>
    </div>
    ${renderBottomTabs('profile')}
  </div>`;
}

// ===================================================================
// PERSISTENCE HELPERS
// ===================================================================
async function saveProfile(){
  await storageSet('profile:' + state.profile.id, {
    id: state.profile.id, name: state.profile.name,
    avatarBase: state.profile.avatarBase, avatarColorIdx: state.profile.avatarColorIdx,
    avatarAccessory: state.profile.avatarAccessory, createdAt: state.profile.createdAt,
    gradeLevel: state.profile.gradeLevel
  });
}
async function saveProgress(){
  await storageSet('progress:' + state.profile.id, state.progress);
}

// ===================================================================
// AVATAR CREATOR ACTIONS
// ===================================================================
function captureAvatarName(){
  const nameInput = document.getElementById('avatar-name');
  if (nameInput) state.draftAvatar.name = nameInput.value;
}
function refocusAvatarName(){
  const el = document.getElementById('avatar-name');
  if (el){ el.focus(); const v = el.value; el.setSelectionRange(v.length, v.length); }
}
function pickBase(v){ captureAvatarName(); state.draftAvatar.base = v; render(); refocusAvatarName(); }
function pickColor(i){ captureAvatarName(); state.draftAvatar.colorIdx = i; render(); refocusAvatarName(); }
function pickAccessory(v){ captureAvatarName(); state.draftAvatar.accessory = v; render(); refocusAvatarName(); }

function newAdventurer(){
  state.editingAvatar = false;
  state.draftAvatar = { base: pick(AVATAR_BASES), colorIdx: randInt(0, AVATAR_COLORS.length-1), accessory:'none', name:'' };
  state.screen = 'create';
  render();
}

function editAvatar(){
  const p = state.profile;
  state.editingAvatar = true;
  state.draftAvatar = { base: p.avatarBase, colorIdx: p.avatarColorIdx, accessory: p.avatarAccessory, name: p.name };
  state.screen = 'create';
  render();
}

async function saveAvatar(){
  const nameInput = document.getElementById('avatar-name');
  const name = (nameInput ? nameInput.value : state.draftAvatar.name).trim() || 'Adventurer';

  if (state.editingAvatar){
    state.profile.name = name;
    state.profile.avatarBase = state.draftAvatar.base;
    state.profile.avatarColorIdx = state.draftAvatar.colorIdx;
    state.profile.avatarAccessory = state.draftAvatar.accessory;
    await saveProfile();
    const idx = state.profiles.findIndex(p => p.id === state.profile.id);
    if (idx !== -1) state.profiles[idx] = { ...state.profile, progress: state.progress };
    state.editingAvatar = false;
    state.screen = 'profile';
    render();
    return;
  }

  const id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  state.profile = {
    id, name,
    avatarBase: state.draftAvatar.base,
    avatarColorIdx: state.draftAvatar.colorIdx,
    avatarAccessory: state.draftAvatar.accessory,
    gradeLevel: null,
    createdAt: Date.now()
  };
  state.progress = freshProgress();
  await saveProfile();
  await saveProgress();
  state.draftGrade = null;
  state.screen = 'grade';
  render();
}

function pickGrade(grade){
  state.draftGrade = grade;
  render();
}

async function saveGrade(){
  const input = document.getElementById('grade-level');
  const grade = Number(input ? input.value : state.draftGrade);
  if (!Number.isFinite(grade) || grade < 1) return;
  state.draftGrade = Math.floor(grade);
  state.profile.gradeLevel = state.draftGrade;
  const startingGrade = Math.min(9, Math.max(5, state.draftGrade));
  STRANDS.forEach(s => { state.progress.strandGrade[s.key] = startingGrade; });
  await saveProfile();
  await saveProgress();
  state.screen = 'map';
  render();
}

function backToLogin(){ state.screen = 'login'; render(); }
function backFromCreate(){ state.screen = state.editingAvatar ? 'profile' : 'login'; state.editingAvatar = false; render(); }

async function continueProfile(id){
  const found = state.profiles.find(p => p.id === id);
  if (!found) return;
  state.profile = found;
  state.progress = found.progress || freshProgress();
  if (found.gradeLevel == null){
    state.draftGrade = null;
    state.screen = 'grade';
  } else {
    state.screen = 'map';
  }
  render();
}

function switchProfile(){
  state.profile = null; state.progress = null; state.editingAvatar = false;
  init();
}

function goQuests(){ state.screen = 'quests'; render(); }
function goProfileTab(){ state.screen = 'profile'; render(); }
function goTab(key){
  if (key === 'map') goMap();
  else if (key === 'quests') goQuests();
  else if (key === 'dashboard') goDashboard();
  else if (key === 'profile') goProfileTab();
}

// ===================================================================
// QUEST / ADAPTIVE ENGINE  (Duolingo-style: select → check → continue)
// ===================================================================
function drawQuestion(key){
  state.currentQuestion = strandByKey(key).gens[state.progress.strandGrade[key]]();
}

function enterStrand(key, training){
  state.lesson = { strand:key, index:0, total:LESSON_LENGTH, hearts:HEARTS_MAX, correctCount:0, xpEarned:0, gemsEarned:0, training:!!training };
  state.phase = 'selecting';
  state.selectedChoice = null;
  drawQuestion(key);
  state.screen = 'quest';
  render();
}

function selectChoice(idx){
  if (state.phase !== 'selecting') return;
  state.selectedChoice = idx;
  render();
}

async function checkAnswer(){
  if (state.phase !== 'selecting' || state.selectedChoice === null) return;
  state.phase = 'checked';
  const les = state.lesson;
  const key = les.strand;
  const pr = state.progress;
  const q = state.currentQuestion;
  const correct = state.selectedChoice === q.correctIndex;

  les.index++;
  pr.totalAnswered++;
  pr.strandAnswered[key] = (pr.strandAnswered[key]||0) + 1;

  if (correct){
    les.correctCount++;
    pr.totalCorrect++;
    pr.strandCorrect[key] = (pr.strandCorrect[key]||0) + 1;
    pr.currentStreak++;
    pr.bestStreak = Math.max(pr.bestStreak, pr.currentStreak);
    pr.xp += 10; les.xpEarned += 10;
    pr.coins += 1; les.gemsEarned += 1;
    pr.strandStreakUp[key]++;
    pr.strandStreakDown[key] = 0;

    if (pr.strandStreakUp[key] >= LEVEL_UP_STREAK){
      const oldGrade = pr.strandGrade[key];
      if (oldGrade < 9){
        pr.strandGrade[key] = oldGrade + 1;
        pr.xp += 25; les.xpEarned += 25;
        pr.coins += 5; les.gemsEarned += 5;
        setTimeout(() => showToast(`🎉 Leveled up! ${strandByKey(key).name}: ${gradeLabel(pr.strandGrade[key])}`), 300);
      }
      pr.strandStreakUp[key] = 0;
    }
  } else {
    pr.mistakes = pr.mistakes || [];
    pr.mistakes.unshift({
      prompt:q.prompt, selected:q.choices[state.selectedChoice], correct:q.choices[q.correctIndex],
      explanation:q.explanation, strand:key, strandName:strandByKey(key).name, createdAt:Date.now()
    });
    pr.mistakes = pr.mistakes.slice(0, 20);
    pr.currentStreak = 0;
    pr.strandStreakDown[key]++;
    pr.strandStreakUp[key] = 0;
    les.hearts--;
    if (pr.strandStreakDown[key] >= LEVEL_DOWN_MISSES){
      const oldGrade = pr.strandGrade[key];
      if (oldGrade > 5) pr.strandGrade[key] = oldGrade - 1;
      pr.strandStreakDown[key] = 0;
    }
  }

  const newlyEarned = BADGES.filter(b => !pr.badges.includes(b.id) && b.check(pr));
  newlyEarned.forEach(b => { pr.badges.push(b.id); setTimeout(() => showToast(`🏅 Badge: ${b.name}`), 650); });

  const newlyCompletedQuests = QUESTS.filter(qd => !pr.questsCompleted.includes(qd.id) && qd.progress(pr) >= qd.target);
  newlyCompletedQuests.forEach(qd => {
    pr.questsCompleted.push(qd.id);
    pr.xp += qd.xp; les.xpEarned += qd.xp;
    pr.coins += qd.gems; les.gemsEarned += qd.gems;
    setTimeout(() => showToast(`🎯 Quest complete: ${qd.name}! +${qd.xp} XP`), 1000);
  });

  await saveProgress();
  render();
}

function continueLesson(){
  const les = state.lesson;
  if (les.hearts <= 0 || les.index >= les.total){
    state.screen = 'lesson-complete';
    render();
    return;
  }
  state.phase = 'selecting';
  state.selectedChoice = null;
  drawQuestion(les.strand);
  render();
}

function quitLesson(){ state.screen = 'map'; render(); }

async function resetProgress(){
  if (!confirm('Reset all progress for ' + state.profile.name + '? This cannot be undone.')) return;
  state.progress = freshProgress();
  await saveProgress();
  render();
}

function goMap(){ state.screen = 'map'; render(); }
function goDashboard(){ state.screen = 'dashboard'; render(); }

function startTraining(){
  const mistakes = state.progress.mistakes || [];
  const focus = mistakes.length ? mistakes[0].strand : STRANDS[0].key;
  enterStrand(focus, true);
}

// ===================================================================
// EVENT DELEGATION
// ===================================================================
function attachHandlers(){ /* no-op: delegated listener attached once below */ }

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  if (action === 'new-adventurer') newAdventurer();
  else if (action === 'continue') continueProfile(el.dataset.id);
  else if (action === 'back-to-login') backToLogin();
  else if (action === 'back-from-create') backFromCreate();
  else if (action === 'edit-avatar') editAvatar();
  else if (action === 'pick-base') pickBase(el.dataset.val);
  else if (action === 'pick-color') pickColor(parseInt(el.dataset.val,10));
  else if (action === 'pick-accessory') pickAccessory(el.dataset.val);
  else if (action === 'save-avatar') saveAvatar();
  else if (action === 'pick-grade') pickGrade(parseInt(el.dataset.grade,10));
  else if (action === 'save-grade') saveGrade();
  else if (action === 'enter-strand') enterStrand(el.dataset.strand);
  else if (action === 'select-choice') selectChoice(parseInt(el.dataset.idx,10));
  else if (action === 'check-answer') checkAnswer();
  else if (action === 'continue-lesson') continueLesson();
  else if (action === 'quit-lesson') quitLesson();
  else if (action === 'go-map') goMap();
  else if (action === 'go-dashboard') goDashboard();
  else if (action === 'go-tab') goTab(el.dataset.screen);
  else if (action === 'start-training') startTraining();
  else if (action === 'switch-profile') switchProfile();
  else if (action === 'reset-progress') resetProgress();
});

app.addEventListener('change', (e) => {
  if (e.target.id === 'grade-level'){
    const value = Number(e.target.value);
    state.draftGrade = Number.isFinite(value) && value >= 1 ? Math.floor(value) : null;
    render();
  }
});

app.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'avatar-name') saveAvatar();
});

// ===================================================================
// BOOT
// ===================================================================
render();
init();
</script>
</body>
</html>
